name: Unit One interface checks
on:
  push:
    branches: [main, design/taste-skill-second-pass]
  pull_request:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/unit-one-server.log 2>&1 &
          for i in 1 2 3 4 5; do curl -sf http://127.0.0.1:8765/index.html && break || sleep 1; done
      - name: Browser smoke at four widths
        run: node tests/design-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-site-source
          path: |
            index.html
            assets/
            games/
            tests/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 3
