name: Publish Unit 1 Games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage the static site
        run: |
          mkdir -p "$RUNNER_TEMP/unit1-site"
          cp -R index.html assets games "$RUNNER_TEMP/unit1-site/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/unit1-site
      - id: deployment
        uses: actions/deploy-pages@v4
